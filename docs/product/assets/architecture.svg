<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
    <style>
      .box{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5;rx:8}
      .open{fill:#ecfdf5;stroke:#10b981}
      .closed{fill:#fff7ed;stroke:#f97316;stroke-dasharray:6 4}
      .t{fill:#0f172a} .s{fill:#475569;font-size:12px} .h{fill:#0f172a;font-weight:600}
      .arrow{stroke:#6b7280;stroke-width:1.5;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <text x="480" y="26" text-anchor="middle" class="h" font-size="16">DiffusorRT — one runtime, two licensed layers</text>

  <rect x="24" y="60" width="150" height="64" class="box open"/>
  <text x="99" y="86" text-anchor="middle" class="h">Model snapshot</text>
  <text x="99" y="106" text-anchor="middle" class="s">pinned identity</text>

  <rect x="214" y="60" width="160" height="64" class="box open"/>
  <text x="294" y="86" text-anchor="middle" class="h">Reference Compiler</text>
  <text x="294" y="106" text-anchor="middle" class="s">convert · pin · receipt</text>

  <rect x="414" y="60" width="150" height="64" class="box open"/>
  <text x="489" y="86" text-anchor="middle" class="h">Execution package</text>
  <text x="489" y="106" text-anchor="middle" class="s">schema-validated</text>

  <rect x="604" y="60" width="150" height="64" class="box open"/>
  <text x="679" y="86" text-anchor="middle" class="h">Engine</text>
  <text x="679" y="106" text-anchor="middle" class="s">generate · chat · infill · edit</text>

  <path d="M174,92 L214,92" class="arrow"/>
  <path d="M374,92 L414,92" class="arrow"/>
  <path d="M564,92 L604,92" class="arrow"/>

  <rect x="414" y="160" width="340" height="74" class="box open"/>
  <text x="584" y="184" text-anchor="middle" class="h">Canvas runtime</text>
  <text x="584" y="204" text-anchor="middle" class="s">MaskCanvas · active-window planner · decode policies</text>
  <text x="584" y="222" text-anchor="middle" class="s">exact K/V identity, leases, transactions, trace</text>
  <path d="M679,124 L679,160" class="arrow"/>

  <rect x="24" y="266" width="220" height="48" class="box open"/>
  <text x="134" y="286" text-anchor="middle" class="h">NumPy reference</text>
  <text x="134" y="304" text-anchor="middle" class="s">executable semantic oracle</text>

  <rect x="274" y="266" width="220" height="48" class="box open"/>
  <text x="384" y="286" text-anchor="middle" class="h">MLX backend</text>
  <text x="384" y="304" text-anchor="middle" class="s">Apple Silicon, open path</text>

  <rect x="524" y="266" width="230" height="48" class="box closed"/>
  <text x="639" y="286" text-anchor="middle" class="h">Native runtime</text>
  <text x="639" y="304" text-anchor="middle" class="s">separately licensed wheel · stable ABI</text>

  <path d="M484,234 L134,266" class="arrow"/>
  <path d="M560,234 L384,266" class="arrow"/>
  <path d="M640,234 L639,266" class="arrow"/>

  <rect x="790" y="160" width="146" height="26" class="box open"/>
  <text x="863" y="178" text-anchor="middle" class="s">Apache-2.0 source</text>
  <rect x="790" y="196" width="146" height="26" class="box closed"/>
  <text x="863" y="214" text-anchor="middle" class="s">proprietary binary</text>
</svg>
